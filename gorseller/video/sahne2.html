<!DOCTYPE html>

<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>

<defs>

    <!-- envelopes -->

<script>
const INK = '#2a2420';
const S = (w = 5) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const LN = (w = 4, c = INK, op = 1) => `stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"`;

// ---------- YUSUF (front, A+C) — head centre (0,0); head ~ 200 wide ----------
function yusuf(withLegs) {
  let s = '';
  // body (sweater), seated
  s += `<path d="M-230 520 C-240 330 -190 230 -60 200 L60 200 C190 230 240 330 230 520 Z" fill="url(#sweater)" ${S(6)}/>`;
  s += `<path d="M-60 200 Q0 250 60 200" ${LN(5)}/>`; // collar
  s += `<path d="M-50 202 Q0 236 50 202 L44 186 Q0 214 -44 186Z" fill="#e3ddd0" ${S(4)}/>`; // t-shirt collar under
  for (let i = 0; i < 6; i++) s += `<path d="M${-180 + i * 70} 300 q10 60 0 200" ${LN(2.5, '#3d443f', .5)}/>`; // knit ribs
  // arms resting
  s += `<path d="M-215 330 C-260 420 -250 520 -200 560 L-120 560 C-150 500 -160 420 -150 340Z" fill="url(#sweater)" ${S(6)}/>`;
  s += `<path d="M215 330 C260 420 250 520 200 560 L120 560 C150 500 160 420 150 340Z" fill="url(#sweater)" ${S(6)}/>`;
  if (withLegs) {
    // thighs toward viewer + shins down
    s += `<path d="M-150 520 L-20 520 L-30 640 L-160 640Z" fill="#2e333a" ${S(6)}/><path d="M20 520 L150 520 L160 640 L30 640Z" fill="#2e333a" ${S(6)}/>`;
    s += `<path d="M-150 640 L-40 640 L-50 1000 L-140 1000Z" fill="#2e333a" ${S(6)}/><path d="M40 640 L150 640 L140 1000 L50 1000Z" fill="#2e333a" ${S(6)}/>`;
    s += `<rect x="40" y="650" width="112" height="90" rx="26" fill="#1f2326" ${S(5)}/><circle cx="96" cy="695" r="22" fill="#121416" ${S(4)}/>`; // knee brace (his left = viewer right)
    s += `<path d="M-120 520 Q0 560 120 520" ${LN(4, INK, .4)}/>`;
  }
  // hands
  s += `<ellipse cx="-160" cy="565" rx="44" ry="30" fill="url(#skinY)" ${S(5)}/><ellipse cx="160" cy="565" rx="44" ry="30" fill="url(#skinY)" ${S(5)}/>`;
  // neck
  s += `<path d="M-46 110 L-48 205 Q0 232 48 205 L46 110Z" fill="#c39270" ${S(5)}/>`;
  // ---- head group (nods) ----
  s += `<g class="head">`;
  s += `<ellipse cx="-100" cy="10" rx="20" ry="36" fill="url(#skinY)" ${S(5)}/><ellipse cx="100" cy="10" rx="20" ry="36" fill="url(#skinY)" ${S(5)}/>`;
  s += `<path d="M0 -128 C82 -128 104 -62 102 8 C100 84 72 140 0 156 C-72 140 -100 84 -102 8 C-104 -62 -82 -128 0 -128Z" fill="url(#skinY)" ${S(6)}/>`;
  // stubble (grey) + moustache
  s += `<path d="M-96 34 C-90 110 -50 150 0 158 C50 150 90 110 96 34 C84 80 60 98 0 100 C-60 98 -84 80 -96 34Z" fill="#9a938a" opacity=".55"/>`;
  s += `<path d="M-96 34 C-90 110 -50 150 0 158 C50 150 90 110 96 34 C84 80 60 98 0 100 C-60 98 -84 80 -96 34Z" fill="url(#stub)"/>`;
  s += `<path d="M-46 84 Q0 66 46 84 Q0 78 -46 84Z" fill="#7d766d" opacity=".8" ${LN(2)}/>`;
  // hair — defined, salt & pepper
  s += `<path d="M-106 8 C-116 -104 -52 -150 4 -150 C72 -150 120 -106 106 8 C100 -44 86 -74 60 -84 C22 -96 -22 -96 -58 -84 C-86 -74 -100 -44 -106 8Z" fill="#57524c" ${S(6)}/>`;
  s += `<path d="M-58 -84 l6 10 l8 -12 l8 9 l9 -11 l8 10 l9 -11 l8 9 l10 -10 l8 10 l12 -10" fill="#57524c" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>`;
  s += `<path d="M-104 4 C-104 -30 -96 -52 -82 -66 L-80 4Z M104 4 C104 -30 96 -52 82 -66 L80 4Z" fill="#a9a299"/>`; // grey temples
  s += `<path d="M-60 -130 q30 -14 60 -10 M-30 -112 q40 -14 80 -2 M20 -138 q30 -2 54 14 M-84 -100 q16 -24 40 -30 M60 -124 q20 8 30 30 M-20 -96 q20 -10 44 -4 M-70 -76 q10 -14 26 -18 M50 -98 q14 6 22 18" ${LN(3.5, '#a39b91', .95)}/>`;
  s += `<path d="M-40 -140 q20 -6 34 -2 M30 -142 q16 2 26 10 M-92 -60 q4 -20 16 -34 M92 -60 q-4 -20 -16 -34" ${LN(3, '#2e2a26', .8)}/>`; // grey strands
  // brows (inner raised = melancholy)
  s += `<path class="browL" d="M-76 -20 Q-50 -38 -18 -36" ${LN(10, '#3a3531')}/><path class="browR" d="M76 -20 Q50 -38 18 -36" ${LN(10, '#3a3531')}/>`;
  // eyes (tired, heavy lids) — lit by TV
  for (const x of [-46, 46]) {
    s += `<path d="M${x - 26} 6 Q${x} -10 ${x + 26} 6 Q${x} 18 ${x - 26} 6Z" fill="#f4f0e8" ${S(3)}/>`;
    s += `<circle cx="${x}" cy="5" r="9" fill="#5b4a3a"/><circle cx="${x}" cy="5" r="4" fill="#1a1412"/><circle cx="${x + 3}" cy="2" r="2.6" fill="#cfe6f2"/>`;
    s += `<path d="M${x - 28} 2 Q${x} -14 ${x + 28} 4" ${LN(6)}/>`; // heavy upper lid
    s += `<path d="M${x - 18} 26 Q${x} 34 ${x + 18} 26" ${LN(2.5, INK, .55)}/>`; // bags
  }
  // nose (C: characterful)
  s += `<path d="M2 -6 C6 26 22 50 14 62 C6 70 -10 68 -16 60" ${LN(5)}/><path d="M-22 58 q-8 4 -6 10 M24 56 q8 4 6 10" ${LN(3, INK, .6)}/>`;
  // forehead lines
  s += `<path d="M-40 -64 Q0 -74 40 -64 M-30 -50 Q0 -58 30 -50" ${LN(2.5, INK, .35)}/>`;
  // mouth: flat, corners down a touch
  s += `<path class="mouth" d="M-30 112 Q0 106 30 113" ${LN(5)}/><path d="M-32 114 l-6 6 M32 115 l6 6" ${LN(3, INK, .7)}/>`;
  s += `</g>`;
  // TV cool light from front-left
  s += `<path d="M-230 520 C-240 330 -190 230 -60 200 L-46 110 C-80 120 -102 60 -102 8 C-104 -62 -82 -128 0 -128 L0 520Z" fill="#9cc3d8" opacity=".10"/>`;
  return s;
}
document.getElementById('yWide').innerHTML = yusuf(true);
document.getElementById('yClose').innerHTML = yusuf(false);

// ---------- broadcast players ----------
const PL = {
  // blue (attacking up)
  CM: { c: '#3f6fc4', path: [[0, 440, 960], [2.0, 430, 940]] },
  LB: { c: '#3f6fc4', path: [[0, 240, 990], [1.6, 330, 880], [2.6, 420, 800], [5, 430, 790]] },
  LW: { c: '#3f6fc4', path: [[0, 200, 760], [2.6, 190, 730], [5, 200, 720]] },
  ST: { c: '#3f6fc4', path: [[0, 560, 820], [2.4, 520, 780], [3.0, 520, 720], [3.4, 530, 690], [5, 535, 680]] },
  RW: { c: '#3f6fc4', path: [[0, 760, 860], [5, 720, 800]] },
  // white defenders
  D1: { c: '#f1efe8', path: [[0, 260, 820], [2.4, 210, 760], [5, 205, 745]] }, // follows the winger wide -> opens lane
  D2: { c: '#f1efe8', path: [[0, 450, 760], [2.6, 470, 770], [3.4, 500, 735], [5, 505, 730]] },
  D3: { c: '#f1efe8', path: [[0, 620, 760], [3.0, 580, 740], [5, 575, 735]] },
  D4: { c: '#f1efe8', path: [[0, 780, 790], [5, 760, 780]] },
  GK: { c: '#f2c14e', path: [[0, 540, 655], [3.4, 560, 656], [3.6, 590, 650], [5, 592, 650]] }
};
function at(path, u) {
  if (u <= path[0][0]) return [path[0][1], path[0][2]];
  for (let i = 1; i < path.length; i++) if (u <= path[i][0]) {
    const [t0, x0, y0] = path[i - 1], [t1, x1, y1] = path[i]; const k = (u - t0) / (t1 - t0); const e = k * k * (3 - 2 * k);
    return [x0 + (x1 - x0) * e, y0 + (y1 - y0) * e];
  }
  const l = path[path.length - 1]; return [l[1], l[2]];
}
const playerSVG = (c) => `<ellipse cx="0" cy="14" rx="14" ry="5" fill="#000" opacity=".35"/><rect x="-9" y="-16" width="18" height="28" rx="8" fill="${c}" stroke="#111" stroke-width="2"/><circle cx="0" cy="-22" r="7" fill="#c9946f" stroke="#111" stroke-width="2"/>`;
const players = document.getElementById('players');
for (const k in PL) { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.id = 'p' + k; g.innerHTML = playerSVG(PL[k].c); players.appendChild(g); }
// ball: CM -> LB pass (1.4-1.9), LB carries (1.9-2.6), LB -> ST through ball (2.6-3.1), ST shot (3.35-3.6)
function ballPos(u) {
  const p = (k, uu) => at(PL[k].path, uu);
  const lerp2 = (a, b, k) => { k = Math.max(0, Math.min(1, k)); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; };
  if (u < 1.4) { const q = p('CM', u); return [q[0] + 10, q[1] - 6]; }
  if (u < 1.9) return lerp2(p('CM', 1.4), p('LB', 1.9), (u - 1.4) / .5);
  if (u < 2.6) { const q = p('LB', u); return [q[0] + 12, q[1] - 8]; }
  if (u < 3.1) return lerp2(p('LB', 2.6), p('ST', 3.1), (u - 2.6) / .5);
  if (u < 3.35) { const q = p('ST', u); return [q[0] + 8, q[1] - 10]; }
  if (u < 3.6) return lerp2(p('ST', 3.35), [575, 614], (u - 3.35) / .25);
  return [575 + Math.sin(u * 20) * 2, 614];
}

// ---------- timeline ----------
const E = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const C = (x) => Math.max(0, Math.min(1, x));
const A0 = 0, B0 = 2.6, C0 = 7.6, D0 = 10.6, E0 = 14.6, END = 19.4;
const SUBS = [
  { a: 3.0, b: 4.9, who: 'YUSUF', l1: 'Sol bek içeri kayacak…', l2: '' },
  { a: 5.0, b: 6.4, who: 'YUSUF', l1: 'Bak. Bak.', l2: '' },
  { a: 11.0, b: 14.3, who: '', l1: 'Yusuf Demirci o telefonu', l2: 'üç kere açmadı.' }
];
const show = (id, on) => document.getElementById(id).setAttribute('display', on ? 'inline' : 'none');

window.render = function (t) {
  show('shotA', t < B0); show('shotB', t >= B0 && t < C0); show('shotC', t >= C0 && t < D0); show('shotD', t >= D0);

  // A: slow push-in, caption
  const zA = 1 + .06 * E(t / B0);
  document.getElementById('camA').setAttribute('transform', `translate(560 1250) scale(${zA}) translate(-560 -1250)`);
  document.getElementById('flickA').setAttribute('opacity', (.25 + .08 * Math.sin(t * 9) * Math.sin(t * 3.3)).toFixed(3));
  document.getElementById('caption').setAttribute('opacity', (t > .2 && t < B0 - .1) ? Math.min(C((t - .2) / .2), C((B0 - .1 - t) / .2)) : 0);

  // B: broadcast
  if (t >= B0 && t < C0) {
    const u = t - B0;
    for (const k in PL) { const [x, y] = at(PL[k].path, u); document.getElementById('p' + k).setAttribute('transform', `translate(${x} ${y})`); }
    const [bx, by] = ballPos(u); const ball = document.getElementById('ball'); ball.setAttribute('cx', bx); ball.setAttribute('cy', by);
    const goal = u >= 3.6;
    document.getElementById('score').textContent = goal ? 'MAV 1 - 0 BEY' : 'MAV 0 - 0 BEY';
    document.getElementById('clock').textContent = u < 2.5 ? "67'" : "68'";
    document.getElementById('golBanner').setAttribute('opacity', goal ? C((u - 3.65) / .15) : 0);
    document.getElementById('net').setAttribute('d', goal && u < 4.2 ? 'M490 640 L490 604 Q540 592 590 604 L590 640' : 'M490 640 L490 604 L590 604 L590 640');
    const zB = 1.32 + .08 * E(u / 5);
    document.getElementById('camB').setAttribute('transform', `translate(540 870) scale(${zB}) translate(-470 -800)`);
  }

  // C: Yusuf close — no smile, single nod at ~8.7s
  if (t >= C0 && t < D0) {
    const u = t - C0;
    const nod = u > 1.0 && u < 1.8 ? Math.sin((u - 1.0) / .8 * Math.PI) * 6 : 0;
    document.querySelectorAll('#yClose .head').forEach(h => h.setAttribute('transform', `translate(0 ${nod * 1.6}) rotate(${nod * .25})`));
    const zC = 1 + .04 * E(u / 3);
    document.getElementById('camC').setAttribute('transform', `translate(540 1000) scale(${zC}) translate(-540 -1000)`);
    const goalGlow = u < .8 ? .28 - u * .2 : .1;
    document.getElementById('flickC').setAttribute('opacity', (goalGlow + .04 * Math.sin(t * 11)).toFixed(3));
  }

  // D/E: phone
  if (t >= D0) {
    const u = t - D0;
    const zD = 1 + .08 * E(Math.min(u, 4) / 4);
    document.getElementById('camD').setAttribute('transform', `translate(540 960) scale(${zD}) translate(-540 -960)`);
    const calling = t >= E0;
    document.getElementById('lock').setAttribute('opacity', calling ? 0 : 1);
    document.getElementById('call').setAttribute('opacity', calling ? 1 : 0);
    let px = 540, py = 1000, rot = -6, sc = 1;
    if (calling) {
      const v = t - E0;
      const buzz = v < 2.2 ? (Math.floor(v * 4) % 2 === 0 ? Math.sin(v * 140) * 5 : 0) : 0;
      px += buzz; rot += buzz * .4;
      for (const [id, off] of [['ring1', 0], ['ring2', .5]]) { const ph = ((v + off) % 1); const r = document.getElementById(id); r.setAttribute('r', 80 + ph * 70); r.setAttribute('opacity', (1 - ph).toFixed(2)); }
      // hand reaches in (2.2-2.9), grabs, lifts phone away (3.1-4.4)
      const reach = document.getElementById('reach');
      const rIn = E(C((v - 2.2) / .7)), lift = E(C((v - 3.1) / 1.3));
      reach.setAttribute('opacity', v > 2.1 ? 1 : 0);
      const hx = px, hy = py - 420 * (1 - rIn) - 1200 * lift;
      reach.setAttribute('transform', `translate(${hx} ${hy + 30}) rotate(${rot})`);
      py -= 1200 * lift; sc += .08 * lift;
    }
    document.getElementById('phone').setAttribute('transform', `translate(${px} ${py}) rotate(${rot}) scale(${sc})`);
    document.getElementById('phoneShadow').setAttribute('transform', `translate(${px + 26} ${Math.max(py, 1000) + 34}) rotate(${rot})`);
    document.getElementById('phoneShadow').setAttribute('opacity', py < 900 ? .45 * C((py - 400) / 500) : .45);
  }

  // fades at end
  document.getElementById('fade').setAttribute('opacity', C((t - (END - .5)) / .5));

  // subtitles
  let sh = null; for (const s of SUBS) if (t >= s.a && t <= s.b) sh = s;
  const o = sh ? Math.min(C((t - sh.a) / .12), C((sh.b - t) / .12)) : 0;
  document.getElementById('s1').textContent = sh ? sh.l1 : ''; document.getElementById('s2').textContent = sh ? sh.l2 : '';
  document.getElementById('who').textContent = sh ? sh.who : '';
  for (const id of ['s1', 's2', 'who']) document.getElementById(id).setAttribute('opacity', o);
  // single-line subs sit lower
  document.getElementById('s1').setAttribute('y', sh && !sh.l2 ? 1700 : 1665);
  document.getElementById('who').setAttribute('y', sh && !sh.l2 ? 1630 : 1600);
};
window.render(0);
</script>
</body></html>
